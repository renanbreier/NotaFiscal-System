<div class="page-header">
    <h2>Item</h2>

    <app-add-button (click)="openRegisterPopup()"></app-add-button>
</div>

<app-popup-form
        [popupVisible]="popupVisible"
        [popupTitle]="isEdit ? 'Editar Item' : 'Cadastrar Item'"
        (closed)="closePopup()"
        (saved)="saveOrUpdateItem()">

    <div style="padding: 20px;">
        <dx-text-box
                label="Código"
                [showClearButton]="true"
                [(value)]="formItem.codigo">
        </dx-text-box>

        <dx-text-box
                label="Descrição"
                [showClearButton]="true"
                [(value)]="formItem.descricao">
        </dx-text-box>

        <dx-number-box
                label="Valor"
                [showClearButton]="true"
                [showSpinButtons]="true"
                [min]="0"
                [format]="{ type: 'currency', precision: 2, currency: 'BRL' }"
                [(value)]="formItem.valorUnitario">
        </dx-number-box>

    </div>

</app-popup-form>

<app-reusable-datagrid
        [dataSource]="itens"
        [columns]="itemColumns"
        [showBorders]="true"
        [pageSize]="20"
        [keyField]="'id'"
        [showActions]="true"
        (actionClicked)="handleGridAction($event)">
</app-reusable-datagrid>
